name: mirage_chat_app
description: >-
  Offline on-device ChatGPT-style vision-language chat app powered by
  Cactus Compute Mirage (21.6 MB 2-bit quantized VLM) via dart:ffi.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffi: ^2.1.3
  image_picker: ^1.1.2
  image: ^4.3.0
  path_provider: ^2.1.5
  path: ^1.9.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
